name: No user data in PRs

# Hard-blocks any PR that adds or modifies user-layer (private data) files.
# These live ONLY on the candidate's machine per DATA_CONTRACT.md and must never
# enter the repo — they are personal job-search data. Sample/fixture data belongs
# under examples/. Tracked scaffolding (.gitkeep keepers, dir READMEs) is exempt.
# batch/ is where the batch workers write their output: its tracked scripts are
# system layer, while the worker output written beside them is private data
# (#4531). Uses the API (listFiles) so it works for fork PRs too.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });

            // User-layer paths from DATA_CONTRACT.md. Omitted on purpose:
            // voice-dna.md ships as a populated system default, so edits to it
            // are legit; .claude/settings.json and .claude/hooks/ are project
            // harness config that is not gitignored and may legitimately be
            // committed.
            const USER_PATHS = [
              /^cv\.md$/,
              /^config\/profile\.yml$/,
              /^config\/plugins\.yml$/,
              /^modes\/_profile\.md$/,
              /^modes\/_custom\.md$/,
              /^modes\/_brief\.md$/,
              /^portals\.yml$/,
              /^article-digest\.md$/,
              /^plugins\.lock$/,
              /^plugins\.local\//,
              /^documents\//,
              /^interview-prep\//,
              /^data\//,
              /^reports\//,
              /^output\//,
              /^jds\//,
              /^writing-samples\//,
              /^batch\//,
            ];
            // Tracked scaffolding that legitimately lives under those dirs.
            //
            // batch/ and documents/ get an exact allowlist instead of the
            // filename rule. The batch workers write user-layer output into
            // batch/ (tailored CV and cover-letter JSON, prefetched JD text,
            // per-run state), and documents/ is where the user drops their own
            // files for intake (a LinkedIn export, a folder of references). A
            // filename-shaped exemption is exactly what that content can be
            // named: a worker scratch dir or an unpacked export may hold a
            // README.md, and nothing stops private content being committed as
            // batch/tmp/README.md or documents/private/README.md. So under these
            // dirs a path is exempt only by being on its list, which also means
            // a new tracked file there has to be added on purpose.
            //
            // Everywhere else the filename rule stands: data/, reports/, jds/,
            // output/, interview-prep/ and writing-samples/ track real .gitkeep
            // keepers and dir READMEs, and narrowing this globally would fail
            // every PR that touches one.
            const EXACT_SCAFFOLD = {
              'batch/': new Set([
                'batch/README.md',
                'batch/aggregate-tokens.mjs',
                'batch/batch-prompt.md',
                'batch/batch-runner.sh',
                'batch/logs/.gitkeep',
                'batch/tracker-additions/.gitkeep',
              ]),
              'documents/': new Set([
                'documents/.gitkeep',
                'documents/README.md',
              ]),
            };
            const isScaffold = (f) => {
              const dir = Object.keys(EXACT_SCAFFOLD).find((d) => f.startsWith(d));
              return dir
                ? EXACT_SCAFFOLD[dir].has(f)
                : /(^|\/)\.gitkeep$/.test(f) || /(^|\/)README\.md$/.test(f);
            };

            const bad = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter((f) => USER_PATHS.some((re) => re.test(f)) && !isScaffold(f));

            if (bad.length) {
              core.setFailed(
                'This PR adds/modifies user-layer (private data) files. These live ONLY on your ' +
                'machine per DATA_CONTRACT.md and must never be committed — use examples/ for ' +
                'sample data.\nOffending files:\n  ' + bad.join('\n  ')
              );
            } else {
              core.info('OK — no user-layer (private data) files touched.');
            }

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing here writes: the token is read-only and never persisted.
permissions:
  contents: read

# A new push supersedes the running matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One OS failing must not hide the result of the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The repo is committed with LF; Windows runners default to autocrlf,
      # which would rewrite every text file on checkout.
      - name: Force LF checkout on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The declared floor (lib/node-floor.mjs, package.json engines). Exact on
      # purpose: a bare '22' resolves to the newest 22.x and tests nothing.
      # tests/node-floor.test.mjs fails if this drifts from NODE_MIN.
      - name: Set up the Node floor (22.13) for syntax compatibility
        uses: actions/setup-node@v7
        with:
          node-version: '22.13'
      - run: npm run lint
      - name: Set up Node 24 for the test suite
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Skip the postinstall (npx playwright install chromium): the tests
      # never launch a browser.
      - run: npm install --ignore-scripts
      - run: node test-all.mjs --quick
